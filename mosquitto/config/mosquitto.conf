# ============================================
# Mosquitto MQTT Broker Configuration
# Fraud Detection Platform
# ============================================

# Réseau
listener 1883
protocol mqtt

# WebSocket (optionnel pour frontend direct)
listener 9001
protocol websockets

# Authentification
allow_anonymous true
# password_file /mosquitto/config/passwd

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_timestamp true
log_type all

# Performance
max_connections -1
max_queued_messages 1000
max_inflight_messages 20

# Topics de système
sys_interval 10

# Sécurité basique
max_packet_size 10000

# Auto-subscribe à tous les topics (pour debugging)
# Décommenter pour activer
# listener 1883
# acl_file /mosquitto/config/aclfile.txt
